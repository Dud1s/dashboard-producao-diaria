<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Produção Diária</title>
<style>
/* ═══════════════════════ RESET & VARS ═══════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:        #f8fafc;
  --bg-card:   rgba(255,255,255,0.88);
  --bg-card-s: rgba(255,255,255,0.96);
  --text:      #0f172a;
  --text-sub:  #64748b;
  --border:    rgba(226,232,240,0.8);
  --accent:    #dc2626;
  --accent-hover: #b91c1c;
  --accent-light: #fef2f2;
  --bar-fill:  #dc2626;
  --bar-bg:    #f1f5f9;
  --shadow:    0 4px 20px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.08);
  --glass:     saturate(180%) blur(16px);
  --radius:    12px;
  --kpi-bg:    #ffffff;
  --kpi-border: #e2e8f0;
  --tooltip-bg:#0f172a; --tooltip-fg:#ffffff;
  --turno1:    #fca5a5;
  --turno2:    #dc2626;
  --turno3:    #7f1d1d;
}

[data-theme="dark"]{
  --bg:        #0b0f19;
  --bg-card:   rgba(18,24,38,0.88);
  --bg-card-s: rgba(18,24,38,0.96);
  --text:      #f1f5f9;
  --text-sub:  #94a3b8;
  --border:    rgba(255,255,255,0.08);
  --accent:    #ef4444;
  --accent-hover: #f87171;
  --accent-light: rgba(239,68,68,0.15);
  --bar-fill:  #ef4444;
  --bar-bg:    #1e293b;
  --shadow:    0 4px 24px rgba(0,0,0,0.30);
  --shadow-lg: 0 10px 32px rgba(0,0,0,0.45);
  --kpi-bg:    #121826;
  --kpi-border: rgba(255,255,255,0.08);
  --tooltip-bg:#f1f5f9; --tooltip-fg:#0f172a;
  --turno1:    #f87171;
  --turno2:    #dc2626;
  --turno3:    #7f1d1d;
}

body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  transition:background .35s,color .35s;
  line-height:1.5; min-height:100vh;
}

/* ═══════════════════════ LAYOUT ═══════════════════════ */
.wrapper{max-width:1380px;margin:0 auto;padding:20px 24px 40px}

/* ── Header ── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:16px;margin-bottom:20px;
}
.header h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.header h1 span{color:var(--accent);}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.upload-status{font-size:.78rem;color:var(--text-sub)}
.upload-status.ok{color:var(--accent)}
.upload-status.err{color:#b91c1c}

/* Theme toggle */
.theme-btn{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:50px;padding:8px 18px;cursor:pointer;
  font-size:.88rem;color:var(--text);display:flex;align-items:center;gap:8px;
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  box-shadow:var(--shadow);transition:all .25s;
}
.theme-btn:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.theme-icon{font-size:1.1rem}

/* ── Top Filter Bar ── */
.filter-bar{
  background:var(--bg-card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow);
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;
  position:relative;z-index:100;
  transition:background .35s,border-color .35s;
}
.filter-group{display:flex;align-items:center;gap:8px}
.filter-bar label{font-size:.78rem;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:.04em}
.filter-bar input[type=date]{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:7px 12px;color:var(--text);font-size:.88rem;
  transition:border-color .2s;
}
.filter-bar input[type=date]:focus{outline:none;border-color:var(--accent)}

.btn-reset{
  background:transparent;color:var(--text-sub);border:1px solid var(--border);
  border-radius:8px;padding:8px 16px;font-size:.85rem;font-weight:600;cursor:pointer;
  transition:all .2s;margin-left:auto;
}
.btn-reset:hover{border-color:var(--accent);color:var(--accent);background:var(--bar-bg)}

/* ── Custom Multiselect Dropdowns ── */
.dd-multiselect{
  position:relative;display:inline-block;
}
.dd-trigger{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:7px 14px;font-size:.88rem;font-weight:600;color:var(--text);
  cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;
  transition:all .2s;
}
.dd-trigger:hover{border-color:var(--accent)}
.dd-trigger .arrow{font-size:.7rem;opacity:.7;transition:transform .2s}
.dd-multiselect.open .dd-trigger .arrow{transform:rotate(180deg)}

.dd-panel{
  position:absolute;top:calc(100% + 6px);left:0;
  min-width:240px;max-width:320px;
  background:var(--bg-card-s);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:10px;display:none;
  z-index:1000;
}
.dd-multiselect.open .dd-panel{display:block}

.dd-actions{
  display:flex;justify-content:space-between;gap:6px;
  margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border);
}
.dd-actions button{
  background:var(--bar-bg);border:none;border-radius:6px;
  padding:4px 10px;font-size:.75rem;font-weight:600;color:var(--text);
  cursor:pointer;transition:all .15s;
}
.dd-actions button:hover{background:var(--accent);color:#fff}

.dd-items{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.dd-item{
  display:flex;align-items:center;gap:8px;padding:6px 8px;
  border-radius:6px;font-size:.84rem;color:var(--text);
  cursor:pointer;user-select:none;transition:background .15s;
}
.dd-item:hover{background:var(--bar-bg)}
.dd-item input[type=checkbox]{cursor:pointer;accent-color:var(--accent);width:15px;height:15px}

/* ── KPIs ── */
.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;margin-bottom:28px;
}
.kpi-card{
  background:var(--kpi-bg);border:1px solid var(--kpi-border);
  border-radius:var(--radius);padding:20px;color:var(--text);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi-label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-sub);margin-bottom:6px}
.kpi-value{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.kpi-sub{font-size:.78rem;color:var(--text-sub);margin-top:4px}

/* ── Cards ── */
.card{
  background:var(--bg-card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;margin-bottom:24px;box-shadow:var(--shadow);
  transition:background .35s,border-color .35s;
}
.card-title{
  font-size:1.02rem;font-weight:700;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;color:var(--text);
}
.subcard-title{
  font-size:.9rem;font-weight:700;margin-bottom:12px;color:var(--text-sub);
  text-transform:uppercase;letter-spacing:.04em;
}
.kpi-highlight{border:2px solid var(--accent) !important;background:var(--accent-light) !important}

/* ── Tab buttons ── */
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab-btn{
  background:var(--bar-bg);border:none;border-radius:8px;
  padding:7px 16px;font-size:.82rem;font-weight:600;color:var(--text-sub);
  cursor:pointer;transition:all .2s;
}
.tab-btn.active{background:var(--accent);color:#fff}
.tab-btn:hover:not(.active){background:var(--border);color:var(--text)}

/* ── Bar Charts (CSS) ── */
.chart-container{position:relative}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:260px;padding:0 4px}

.bar-col{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;min-width:0;position:relative;
}
.bar{
  width:100%;max-width:48px;border-radius:6px 6px 2px 2px;
  background:var(--bar-fill);position:relative;
  transition:height .4s cubic-bezier(.4,0,.2,1);
  cursor:pointer;min-height:2px;
}
.bar:hover{opacity:.85;transform:scaleX(1.05)}

/* Barra empilhada por turno */
.bar-stack{
  width:100%;max-width:48px;display:flex;flex-direction:column-reverse;
  border-radius:6px 6px 2px 2px;overflow:hidden;cursor:pointer;min-height:2px;
}
.bar-stack:hover{opacity:.85;transform:scaleX(1.05)}
.bar-seg{width:100%;transition:height .4s cubic-bezier(.4,0,.2,1);min-height:0}
.bar-seg.t1{background:var(--turno1)}
.bar-seg.t2{background:var(--turno2)}
.bar-seg.t3{background:var(--turno3)}

.turno-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:.78rem;color:var(--text-sub)}
.turno-legend-item{display:flex;align-items:center;gap:6px}
.turno-legend-swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
.turno-legend-swatch.t1{background:var(--turno1)}
.turno-legend-swatch.t2{background:var(--turno2)}
.turno-legend-swatch.t3{background:var(--turno3)}
.bar-label{
  font-size:.68rem;color:var(--text-sub);margin-top:6px;
  text-align:center;word-break:break-word;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.bar-val{
  font-size:.68rem;font-weight:700;color:var(--text);
  margin-bottom:4px;text-align:center;
}

/* Horizontal bars */
.h-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.h-bar-name{
  flex:0 0 110px;font-size:.82rem;font-weight:600;
  text-align:right;color:var(--text);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.h-bar-track{flex:1;height:26px;background:var(--bar-bg);border-radius:6px;overflow:hidden;position:relative}
.h-bar-fill{
  height:100%;border-radius:6px;background:var(--bar-fill);
  transition:width .5s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;padding-left:10px;
  font-size:.75rem;font-weight:700;color:#fff;
  min-width:fit-content;
}

/* ── Grid layouts ── */
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* ── Ranking Table ── */
.rank-table{width:100%;border-collapse:collapse}
.rank-table th{
  text-align:left;font-size:.75rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text-sub);padding:10px 12px;
  border-bottom:2px solid var(--border);
}
.rank-table td{
  padding:10px 12px;font-size:.88rem;border-bottom:1px solid var(--border);
  transition:background .15s;
}
.rank-table tr:hover td{background:var(--bar-bg)}
.rank-num{
  display:inline-flex;width:24px;height:24px;border-radius:50%;
  align-items:center;justify-content:center;font-size:.75rem;font-weight:700;
  background:var(--bar-bg);color:var(--text-sub);
}
.rank-1{background:var(--accent);color:#fff}
.rank-2{background:var(--accent2);color:#fff}
.rank-3{background:var(--accent3);color:#fff}
.rank-bar-cell{width:40%}
.rank-bar-bg{height:8px;background:var(--bar-bg);border-radius:4px;overflow:hidden}
.rank-bar-fg{height:100%;border-radius:4px;background:var(--bar-fill);transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── Responsive ── */
@media(max-width:900px){
  .grid-3{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
}
@media(max-width:600px){
  .wrapper{padding:12px 10px 30px}
  .header h1{font-size:1.2rem}
  .bar-chart{height:200px}
  .h-bar-name{flex:0 0 75px;font-size:.72rem}
}

/* ── Tooltip Flutuante ── */
.tooltip{
  position:fixed;background:var(--bg-card-s);color:var(--text);
  border:1px solid var(--border);border-radius:12px;
  padding:12px 16px;font-size:.82rem;
  pointer-events:none;opacity:0;transition:opacity .15s ease-out;
  z-index:9999;box-shadow:var(--shadow-lg);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  min-width:220px;max-width:320px;max-height:360px;overflow-y:auto;
}
.tooltip::-webkit-scrollbar{width:4px}
.tooltip::-webkit-scrollbar-track{background:transparent}
.tooltip::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.tooltip.show{opacity:1}
.tip-header{
  font-weight:700;font-size:.88rem;margin-bottom:8px;padding-bottom:6px;
  border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;gap:12px;
}
.tip-title{color:var(--text);font-weight:700}
.tip-total{color:var(--accent);font-weight:800;font-size:.9rem}
.tip-subtitle{
  font-size:.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text-sub);margin-top:4px;margin-bottom:6px;
}
.tip-list{display:flex;flex-direction:column;gap:4px}
.tip-item{
  display:flex;justify-content:space-between;align-items:center;
  font-size:.8rem;padding:4px 8px;border-radius:6px;background:var(--bar-bg);
}
.tip-item-name{color:var(--text);font-weight:600;font-family:Consolas,Monaco,monospace}
.tip-item-val{color:var(--accent);font-weight:700;margin-left:12px}

/* ── No data ── */
.no-data{
  text-align:center;padding:40px;color:var(--text-sub);font-style:italic;
}
</style>
</head>
<body>
<div class="tooltip" id="tooltip"></div>
<div class="wrapper">

  <!-- Header -->
  <div class="header">
    <h1>Dashboard <span>Produção Diária</span></h1>
    <div class="header-actions">
      <input type="file" id="xlsxUploadProducao" accept=".xlsx,.xls" style="display:none" onchange="handleXlsxUploadProducao(event)">
      <button class="theme-btn" id="uploadBtnProducao" onclick="document.getElementById('xlsxUploadProducao').click()">
        <span class="theme-icon">📁</span>
        <span>Carregar XLSX Produção</span>
      </button>
      <span class="upload-status" id="uploadStatusProducao"></span>

      <input type="file" id="xlsxUploadRefugo" accept=".xlsx,.xls" style="display:none" onchange="handleXlsxUploadRefugo(event)">
      <button class="theme-btn" id="uploadBtnRefugo" onclick="document.getElementById('xlsxUploadRefugo').click()">
        <span class="theme-icon">🗑️</span>
        <span>Carregar XLSX Refugo</span>
      </button>
      <span class="upload-status" id="uploadStatusRefugo"></span>

      <button class="theme-btn" id="atualizarBtn" onclick="atualizarDashboard()" disabled style="opacity:.5;cursor:not-allowed">
        <span class="theme-icon">🔄</span>
        <span>Atualizar</span>
      </button>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">
        <span class="theme-icon" id="themeIcon">🌙</span>
        <span id="themeLabel">Escuro</span>
      </button>
    </div>
  </div>

  <!-- Top Filter Bar -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>De:</label>
      <input type="date" id="filtroInicio" value="2026-06-05" onchange="aplicarFiltros()">
    </div>
    <div class="filter-group">
      <label>Até:</label>
      <input type="date" id="filtroFim" value="2026-08-24" onchange="aplicarFiltros()">
    </div>

    <!-- Dropdown: Tipo de Produto -->
    <div class="dd-multiselect" id="ddTipoProduto">
      <div class="dd-trigger" onclick="toggleDD('ddTipoProduto')">
        <span>Tipo: <strong id="lblTipoProduto">Todos</strong></span>
        <span class="arrow">▼</span>
      </div>
      <div class="dd-panel">
        <div class="dd-actions">
          <button onclick="checkAllDD('ddTipoProduto', true)">Marcar Todos</button>
          <button onclick="checkAllDD('ddTipoProduto', false)">Desmarcar Todos</button>
        </div>
        <div class="dd-items" id="itemsTipoProduto"></div>
      </div>
    </div>

    <!-- Dropdown: Categoria de Máquinas -->
    <div class="dd-multiselect" id="ddCategoria">
      <div class="dd-trigger" onclick="toggleDD('ddCategoria')">
        <span>Categoria: <strong id="lblCategoria">Todas</strong></span>
        <span class="arrow">▼</span>
      </div>
      <div class="dd-panel">
        <div class="dd-actions">
          <button onclick="checkAllDD('ddCategoria', true)">Marcar Todas</button>
          <button onclick="checkAllDD('ddCategoria', false)">Desmarcar Todas</button>
        </div>
        <div class="dd-items" id="itemsCategoria"></div>
      </div>
    </div>

    <!-- Dropdown: Máquina (Ordenadas) -->
    <div class="dd-multiselect" id="ddMaquina">
      <div class="dd-trigger" onclick="toggleDD('ddMaquina')">
        <span>Máquinas: <strong id="lblMaquina">Todas</strong></span>
        <span class="arrow">▼</span>
      </div>
      <div class="dd-panel">
        <div class="dd-actions">
          <button onclick="checkAllDD('ddMaquina', true)">Marcar Todas</button>
          <button onclick="checkAllDD('ddMaquina', false)">Desmarcar Todas</button>
        </div>
        <div class="dd-items" id="itemsMaquina"></div>
      </div>
    </div>

    <!-- Dropdown: Turno -->
    <div class="dd-multiselect" id="ddTurno">
      <div class="dd-trigger" onclick="toggleDD('ddTurno')">
        <span>Turno: <strong id="lblTurno">Todos</strong></span>
        <span class="arrow">▼</span>
      </div>
      <div class="dd-panel">
        <div class="dd-actions">
          <button onclick="checkAllDD('ddTurno', true)">Marcar Todos</button>
          <button onclick="checkAllDD('ddTurno', false)">Desmarcar Todos</button>
        </div>
        <div class="dd-items" id="itemsTurno"></div>
      </div>
    </div>

    <button class="btn-reset" onclick="resetarTudo()">Limpar Filtros</button>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- Main chart: daily/weekly/monthly -->
  <div class="card">
    <div class="card-title">Produção por Período</div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="diaria" onclick="setTab(this,'periodo')">Diária</button>
      <button class="tab-btn" data-tab="semanal" onclick="setTab(this,'periodo')">Semanal</button>
      <button class="tab-btn" data-tab="mensal" onclick="setTab(this,'periodo')">Mensal</button>
    </div>
    <div class="turno-legend" id="legendaPeriodo"></div>
    <div id="chartPeriodo" class="chart-container"></div>
  </div>

  <!-- Category breakdowns -->
  <div class="grid-3">
    <div class="card">
      <div class="card-title">Por Máquina</div>
      <div id="chartMaquina" class="chart-container"></div>
    </div>
    <div class="card">
      <div class="card-title">Por Turno</div>
      <div id="chartTurno" class="chart-container"></div>
    </div>
    <div class="card">
      <div class="card-title">Por Dia da Semana</div>
      <div id="chartDiaSemana" class="chart-container"></div>
    </div>
  </div>

  <!-- Indicadores de Refugo -->
  <div class="card">
    <div class="card-title">Indicadores de Refugo</div>
    <div class="kpi-grid" id="kpiRefugoGrid" style="margin-bottom:24px"></div>
    <div class="grid-2">
      <div>
        <div class="subcard-title">Ranking de Causas de Refugo</div>
        <div id="chartCausasRefugo" class="chart-container"></div>
      </div>
      <div>
        <div class="subcard-title">Itens com Mais Refugo</div>
        <div id="chartItensRefugo" class="chart-container"></div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

function aplicarFiltros() {
  const ini = document.getElementById('filtroInicio').value;
  const fim = document.getElementById('filtroFim').value;

  dadosFiltrados = DADOS_BRUTOS.filter(r => {
    if (ini && r.DATA < ini) return false;
    if (fim && r.DATA > fim) return false;

    const info = getInfo(r.CT);
    if (!SEL.ddTipoProduto.has(info.tipo)) return false;
    if (!SEL.ddCategoria.has(info.cat)) return false;
    if (!SEL.ddMaquina.has(r.CT)) return false;
    if (!SEL.ddTurno.has(r.TURNO)) return false;

    return true;
  });

  refugoFiltrado = REFUGO_BRUTOS.filter(r => {
    if (ini && r.DATA < ini) return false;
    if (fim && r.DATA > fim) return false;

    const info = getInfo(r.SETOR);
    if (!SEL.ddTipoProduto.has(info.tipo)) return false;
    if (!SEL.ddCategoria.has(info.cat)) return false;
    if (!SEL.ddMaquina.has(r.SETOR)) return false;
    if (!SEL.ddTurno.has(r.TURNO)) return false;

    return true;
  });

  renderAll();
}

// ═══════════════════════ UPLOAD / ATUALIZAÇÃO VIA XLSX ═══════════════════════
// Os uploads de Produção e Refugo são independentes ao carregar, mas o botão
// "Atualizar" aplica ambos juntos e recalcula filtros compartilhados
// (lista de máquinas e período de datas) considerando os dois datasets.
let dadosPendentesProducao = null; // produção lida do XLSX, aguardando confirmação
let dadosPendentesRefugo = null;   // refugo lido do XLSX, aguardando confirmação

function normalizarDataValor(v) {
  if (v instanceof Date) {
    // usa componentes UTC para evitar deslocamento de fuso horário
    const ano = v.getUTCFullYear();
    const mes = String(v.getUTCMonth() + 1).padStart(2, '0');
    const dia = String(v.getUTCDate()).padStart(2, '0');
    return `${ano}-${mes}-${dia}`;
  }
  const str = String(v ?? '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return str;
}

function parseXLSXProducao(arrayBuffer) {
  if (typeof XLSX === 'undefined') {
    throw new Error('Biblioteca de leitura de XLSX não carregou (é necessária conexão com a internet na primeira vez).');
  }
  const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
  const nomeAba = workbook.SheetNames[0];
  if (!nomeAba) throw new Error('A planilha não contém nenhuma aba.');
  const planilha = workbook.Sheets[nomeAba];
  const linhas = XLSX.utils.sheet_to_json(planilha, { raw: true, defval: '' });
  if (!linhas.length) throw new Error('Planilha vazia ou sem linhas de dados.');

  const mapaChaves = {};
  Object.keys(linhas[0]).forEach(k => { mapaChaves[k.trim().toUpperCase()] = k; });

  const obrigatorias = ['CT', 'DATA', 'CODIGO', 'QUANTIDADE PRODUZIDA', 'TURNO'];
  const faltando = obrigatorias.filter(c => !(c in mapaChaves));
  if (faltando.length > 0) {
    throw new Error('Colunas ausentes na planilha de produção: ' + faltando.join(', '));
  }
  const temOP = 'OP' in mapaChaves; // coluna OP é opcional

  const registros = linhas
    .map(linha => ({
      OP: temOP ? (linha[mapaChaves['OP']] === '' ? null : linha[mapaChaves['OP']]) : null,
      CT: String(linha[mapaChaves['CT']] ?? '').toLowerCase().trim(),
      DATA: normalizarDataValor(linha[mapaChaves['DATA']]),
      CODIGO: parseInt(linha[mapaChaves['CODIGO']], 10) || 0,
      'QUANTIDADE PRODUZIDA': parseInt(linha[mapaChaves['QUANTIDADE PRODUZIDA']], 10) || 0,
      TURNO: String(linha[mapaChaves['TURNO']] ?? '').trim()
    }))
    .filter(r => r.CT); // descarta linhas em branco

  if (!registros.length) throw new Error('Nenhum registro válido encontrado na planilha de produção.');
  return registros;
}

function parseXLSXRefugo(arrayBuffer) {
  if (typeof XLSX === 'undefined') {
    throw new Error('Biblioteca de leitura de XLSX não carregou (é necessária conexão com a internet na primeira vez).');
  }
  const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
  const nomeAba = workbook.SheetNames[0];
  if (!nomeAba) throw new Error('A planilha não contém nenhuma aba.');
  const planilha = workbook.Sheets[nomeAba];
  const linhas = XLSX.utils.sheet_to_json(planilha, { raw: true, defval: '' });
  if (!linhas.length) throw new Error('Planilha vazia ou sem linhas de dados.');

  const mapaChaves = {};
  Object.keys(linhas[0]).forEach(k => { mapaChaves[k.trim().toUpperCase()] = k; });

  const obrigatorias = ['SETOR', 'DATA', 'DESCRIÇÃO REFUGO', 'QUANTIDADE', 'TURNO'];
  const faltando = obrigatorias.filter(c => !(c in mapaChaves));
  if (faltando.length > 0) {
    throw new Error('Colunas ausentes na planilha de refugo: ' + faltando.join(', '));
  }
  const temOP = 'OP' in mapaChaves;
  const temCodProduto = 'CODIGO DO PRODUTO' in mapaChaves;
  const temCodRefugo = 'CODIGO DO REFUGO' in mapaChaves;

  const registros = linhas
    .map(linha => ({
      OP: temOP ? (linha[mapaChaves['OP']] === '' ? null : linha[mapaChaves['OP']]) : null,
      SETOR: String(linha[mapaChaves['SETOR']] ?? '').toLowerCase().trim(),
      DATA: normalizarDataValor(linha[mapaChaves['DATA']]),
      'CODIGO DO PRODUTO': temCodProduto ? (parseInt(linha[mapaChaves['CODIGO DO PRODUTO']], 10) || 0) : 0,
      'CODIGO DO REFUGO': temCodRefugo ? (parseInt(linha[mapaChaves['CODIGO DO REFUGO']], 10) || 0) : 0,
      'DESCRIÇÃO REFUGO': String(linha[mapaChaves['DESCRIÇÃO REFUGO']] ?? '').trim(),
      QUANTIDADE: parseInt(linha[mapaChaves['QUANTIDADE']], 10) || 0,
      TURNO: String(linha[mapaChaves['TURNO']] ?? '').trim()
    }))
    .filter(r => r.SETOR); // descarta linhas em branco

  if (!registros.length) throw new Error('Nenhum registro válido encontrado na planilha de refugo.');
  return registros;
}

// Recalcula a lista de máquinas com base na união de Produção (CT) + Refugo (SETOR),
// já que o filtro "Máquinas" é compartilhado pelos dois datasets.
function recalcularMaquinasOrdenadas() {
  const maquinasProducao = new Set(DADOS_BRUTOS.map(r => r.CT));
  const maquinasRefugo = new Set(REFUGO_BRUTOS.map(r => r.SETOR));
  const todasMaquinas = new Set([...maquinasProducao, ...maquinasRefugo]);

  MAQUINAS_ORDENADAS_JS = MAQUINAS_MESTRA_JS.filter(m => todasMaquinas.has(m));
  todasMaquinas.forEach(m => {
    if (!MAQUINAS_ORDENADAS_JS.includes(m)) MAQUINAS_ORDENADAS_JS.push(m);
  });
  OPCOES.ddMaquina = MAQUINAS_ORDENADAS_JS.map(m => ({ id: m, label: m }));
}

// Aplica os dados pendentes (produção e/ou refugo) e recalcula os filtros
// compartilhados entre os dois datasets.
function aplicarNovosDados({ producao, refugo }) {
  if (producao) DADOS_BRUTOS = producao;
  if (refugo) REFUGO_BRUTOS = refugo;

  recalcularMaquinasOrdenadas();

  // Reseta a seleção de todos os filtros para "todos marcados"
  Object.keys(OPCOES).forEach(ddId => {
    SEL[ddId] = new Set(OPCOES[ddId].map(o => o.id));
  });

  // Atualiza o período do filtro de datas considerando os dois datasets
  const datasProducao = DADOS_BRUTOS.map(r => r.DATA).filter(Boolean);
  const datasRefugo = REFUGO_BRUTOS.map(r => r.DATA).filter(Boolean);
  const datasValidas = [...datasProducao, ...datasRefugo].sort();
  if (datasValidas.length) {
    document.getElementById('filtroInicio').value = datasValidas[0];
    document.getElementById('filtroFim').value = datasValidas[datasValidas.length - 1];
  }

  initDropdowns();
  dadosFiltrados = [...DADOS_BRUTOS];
  refugoFiltrado = [...REFUGO_BRUTOS];
  renderAll();
}

function habilitarBotaoAtualizar() {
  const btn = document.getElementById('atualizarBtn');
  const habilitar = !!(dadosPendentesProducao || dadosPendentesRefugo);
  btn.disabled = !habilitar;
  btn.style.opacity = habilitar ? '1' : '.5';
  btn.style.cursor = habilitar ? 'pointer' : 'not-allowed';
}

function handleXlsxUploadProducao(event) {
  const arquivo = event.target.files[0];
  const status = document.getElementById('uploadStatusProducao');
  if (!arquivo) return;

  const leitor = new FileReader();
  leitor.onload = function(e) {
    try {
      dadosPendentesProducao = parseXLSXProducao(e.target.result);
      status.textContent = `Produção: ${dadosPendentesProducao.length} registros prontos ("${arquivo.name}").`;
      status.className = 'upload-status ok';
      habilitarBotaoAtualizar();
    } catch (err) {
      dadosPendentesProducao = null;
      habilitarBotaoAtualizar();
      status.textContent = 'Erro: ' + err.message;
      status.className = 'upload-status err';
    } finally {
      event.target.value = '';
    }
  };
  leitor.onerror = function() {
    dadosPendentesProducao = null;
    habilitarBotaoAtualizar();
    status.textContent = 'Erro ao ler o arquivo.';
    status.className = 'upload-status err';
    event.target.value = '';
  };
  leitor.readAsArrayBuffer(arquivo);
}

function handleXlsxUploadRefugo(event) {
  const arquivo = event.target.files[0];
  const status = document.getElementById('uploadStatusRefugo');
  if (!arquivo) return;

  const leitor = new FileReader();

      habilitarBotaoAtualizar();
      status.textContent = 'Erro: ' + err.message;
      status.className = 'upload-status err';
    } finally {
      event.target.value = '';
    }
  };
  leitor.onerror = function() {
    dadosPendentesRefugo = null;
    habilitarBotaoAtualizar();

function atualizarDashboard() {
  if (!dadosPendentesProducao && !dadosPendentesRefugo) return;

  const statusProducao = document.getElementById('uploadStatusProducao');
  const statusRefugo = document.getElementById('uploadStatusRefugo');
  const qtdProducao = dadosPendentesProducao ? dadosPendentesProducao.length : null;
  const qtdRefugo = dadosPendentesRefugo ? dadosPendentesRefugo.length : null;

  aplicarNovosDados({ producao: dadosPendentesProducao, refugo: dadosPendentesRefugo });

  if (qtdProducao !== null) {
    statusProducao.textContent = `✔ Produção atualizada (${qtdProducao} registros).`;
    statusProducao.className = 'upload-status ok';
  }
  if (qtdRefugo !== null) {
    statusRefugo.textContent = `✔ Refugo atualizado (${qtdRefugo} registros).`;
    statusRefugo.className = 'upload-status ok';
  }

  dadosPendentesProducao = null;
  dadosPendentesRefugo = null;
  habilitarBotaoAtualizar();
}

// ═══════════════════════ HELPERS ═══════════════════════
function fmt(n) { return n.toLocaleString('pt-BR'); }
function fmtDec(n,d=1) { return n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); }

function groupBy(arr, keyFn, valFn) {
  const map = {};
  arr.forEach(r => {
    const k = keyFn(r);
    map[k] = (map[k]||0) + valFn(r);
  });
  return map;
}

function getWeekOfMonthKey(dateStr) {
  if (!dateStr || dateStr.length < 10) return dateStr;
  const parts = dateStr.split('-');
  const day = parseInt(parts[2], 10);
  const weekNum = Math.min(Math.ceil(day / 7), 4);
  return `${parts[0]}-${parts[1]}-W${weekNum}`;
}

function fmtSemanaMesBR(weekKey) {
  const parts = weekKey.split('-W');
  if (parts.length === 2) {
    const ym = parts[0].split('-');
    return `${parts[1]}/${ym[1]}`;
  }
  return weekKey;
}

function getMonth(dateStr) { return dateStr.slice(0,7); }

function fmtMesAnoBR(monthKey) {
  const parts = monthKey.split('-');
  if (parts.length === 2) {
    return `${parts[1]}/${parts[0]}`;
  }
  return monthKey;
}

const DIAS_SEMANA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function getDiaSemana(dateStr) {
  return DIAS_SEMANA[new Date(dateStr + 'T00:00:00').getDay()];
}

// Extrai somente os dígitos da OP (remove prefixos como "OP-"/"op-" e
// zeros à esquerda), mesma lógica usada em analise_refugo.py, para
// relacionar produção e refugo pela mesma Ordem de Produção.
function normalizarOP(valor) {
  if (valor === null || valor === undefined || valor === '') return null;
  const digitos = String(valor).replace(/\D/g, '');
  if (!digitos) return null;
  return parseInt(digitos, 10);
}

function fmtDataBR(dateStr) {
  if (!dateStr || dateStr.length < 10) return dateStr;
  const parts = dateStr.split('-');
  if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return dateStr;
}

function fmtDiaMesBR(dateStr) {
  if (!dateStr || dateStr.length < 10) return dateStr;
  const parts = dateStr.split('-');
  if (parts.length === 3) return `${parts[2]}/${parts[1]}`;
  return dateStr;
}

// ═══════════════════════ TOOLTIP FLUTUANTE & PRODUTOS ═══════════════════════
const tip = document.getElementById('tooltip');
const chartDataStore = {};

function getProdutosPorGrupo(records, keyFn) {
  const map = {};
  records.forEach(r => {
    const k = keyFn(r);
    const cod = String(r.CODIGO || 'Sem código');
    const qtd = Number(r['QUANTIDADE PRODUZIDA']) || 0;
    if (!map[k]) map[k] = {};
    map[k][cod] = (map[k][cod] || 0) + qtd;
  });
  const result = {};
  Object.keys(map).forEach(k => {
    result[k] = Object.entries(map[k])
      .map(([codigo, quantidade]) => ({ codigo, quantidade }))
      .sort((a, b) => b.quantidade - a.quantidade);
  });
  return result;
}

// Versão genérica: agrupa por uma chave e detalha por uma subchave
// customizável (usada pelos indicadores de refugo: causas × itens).
function getBreakdownPorGrupo(records, keyFn, subKeyFn, valFn) {
  const map = {};
  records.forEach(r => {
    const k = keyFn(r);
    const sub = subKeyFn(r);
    const val = Number(valFn(r)) || 0;
    if (!map[k]) map[k] = {};
    map[k][sub] = (map[k][sub] || 0) + val;
  });
  const result = {};
  Object.keys(map).forEach(k => {
    result[k] = Object.entries(map[k])
      .map(([codigo, quantidade]) => ({ codigo, quantidade }))
      .sort((a, b) => b.quantidade - a.quantidade);
  });
  return result;
}

function showBarTip(e, containerId, idx) {
  const item = chartDataStore[containerId] && chartDataStore[containerId][idx];
  if (!item) return;

  const title = item.fullLabel || item.label;
  let html = `<div class="tip-header">
    <span class="tip-title">${title}</span>
    <span class="tip-total">${fmt(item.value)} un.</span>
  </div>`;

  if (item.turnos && item.turnos.length > 0) {
    html += `<div class="tip-subtitle">Por Turno</div>`;
    html += `<div class="tip-list">`;
    item.turnos.forEach(t => {
      html += `<div class="tip-item">
        <span class="tip-item-name" style="display:flex;align-items:center;gap:6px">
          <span class="turno-legend-swatch t${t.n}"></span>${t.turno}
        </span>
        <span class="tip-item-val">${fmt(t.value)} un.</span>
      </div>`;
    });
    html += `</div>`;
  }

  if (item.produtos && item.produtos.length > 0) {
    const prodsValidos = item.produtos.filter(p => p.quantidade > 0);
    const lista = prodsValidos.length > 0 ? prodsValidos : item.produtos;
    const subtitulo = item.subtitulo || 'Produtos Produzidos';
    const prefixo = item.prefixo !== undefined ? item.prefixo : 'Cód. ';

    html += `<div class="tip-subtitle">${subtitulo} (${lista.length})</div>`;
    html += `<div class="tip-list">`;
    lista.forEach(p => {
      html += `<div class="tip-item">
        <span class="tip-item-name">${prefixo}${p.codigo}</span>
        <span class="tip-item-val">${fmt(p.quantidade)} un.</span>
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="tip-item" style="color:var(--text-sub)">Nenhum produto registrado</div>`;
  }

  showTipHtml(e, html);
}

function showTipHtml(e, htmlContent) {
  tip.innerHTML = htmlContent;
  tip.classList.add('show');
  positionTip(e);
}

function moveTip(e) {
  if (tip.classList.contains('show')) {
    positionTip(e);
  }
}

function positionTip(e) {
  const gap = 14;
  let left = e.clientX + gap;
  let top = e.clientY + gap;

  const tipRect = tip.getBoundingClientRect();
  const winW = window.innerWidth;
  const winH = window.innerHeight;

  if (left + tipRect.width > winW - 10) {
    left = e.clientX - tipRect.width - gap;
  }
  if (top + tipRect.height > winH - 10) {
    top = e.clientY - tipRect.height - gap;
  }
  if (left < 10) left = 10;
  if (top < 10) top = 10;

  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function hideTip() {
  tip.classList.remove('show');
}

// ═══════════════════════ RENDER KPIs ═══════════════════════
function renderKPIs() {
  const d = dadosFiltrados;
  if (!d.length) { document.getElementById('kpiGrid').innerHTML = '<div class="no-data">Sem dados com os filtros selecionados</div>'; return; }

  const total = d.reduce((s,r) => s + r['QUANTIDADE PRODUZIDA'], 0);
  const dias = [...new Set(d.map(r => r.DATA))];
  const mediaDia = total / (dias.length || 1);
  const maqMap = groupBy(d, r=>r.CT, r=>r['QUANTIDADE PRODUZIDA']);
  const topMaq = Object.entries(maqMap).sort((a,b)=>b[1]-a[1])[0];
  const turMap = groupBy(d, r=>r.TURNO, r=>r['QUANTIDADE PRODUZIDA']);
  const topTur = Object.entries(turMap).sort((a,b)=>b[1]-a[1])[0];
  const diaMap = groupBy(d, r=>r.DATA, r=>r['QUANTIDADE PRODUZIDA']);
  const topDia = Object.entries(diaMap).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Produção Total</div>
      <div class="kpi-value">${fmt(total)}</div>
      <div class="kpi-sub">${fmt(d.length)} registros</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Média Diária</div>
      <div class="kpi-value">${fmtDec(mediaDia,0)}</div>
      <div class="kpi-sub">${dias.length} dias ativas</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Top Máquina</div>
      <div class="kpi-value">${topMaq ? topMaq[0] : '-'}</div>
      <div class="kpi-sub">${topMaq ? fmt(topMaq[1]) + ' un.' : '-'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Top Turno</div>
      <div class="kpi-value">${topTur ? topTur[0] : '-'}</div>
      <div class="kpi-sub">${topTur ? fmt(topTur[1]) + ' un.' : '-'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Dia Recorde</div>
      <div class="kpi-value">${topDia ? fmtDiaMesBR(topDia[0]) : '-'}</div>
      <div class="kpi-sub">${topDia ? fmt(topDia[1]) + ' un.' : '-'}</div>
    </div>
  `;
}

// ═══════════════════════ VERTICAL BAR CHART ═══════════════════════
function renderVerticalBars(containerId, data) {
  const container = document.getElementById(containerId);
  if (!data.length) { container.innerHTML = '<div class="no-data">Sem dados com os filtros selecionados</div>'; return; }

  chartDataStore[containerId] = data;
  const maxVal = Math.max(...data.map(d=>d.value), 1);
  const barH = 240;

  let html = '<div class="bar-chart">';
  data.forEach((item, idx) => {
    const h = Math.max((item.value / maxVal) * barH, 2);
    html += `<div class="bar-col">
      <div class="bar-val">${fmt(item.value)}</div>
      <div class="bar" style="height:${h}px"
           onmouseenter="showBarTip(event, '${containerId}', ${idx})"
           onmousemove="moveTip(event)"
           onmouseleave="hideTip()"></div>
      <div class="bar-label" title="${item.label}">${item.label}</div>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

// ═══════════════════════ VERTICAL STACKED BAR CHART (POR TURNO) ═══════════════════════
function renderStackedBars(containerId, data) {
  const container = document.getElementById(containerId);
  if (!data.length) { container.innerHTML = '<div class="no-data">Sem dados com os filtros selecionados</div>'; return; }

  chartDataStore[containerId] = data;
  const maxVal = Math.max(...data.map(d=>d.value), 1);
  const barH = 240;

  let html = '<div class="bar-chart">';
  data.forEach((item, idx) => {
    const totalH = Math.max((item.value / maxVal) * barH, 2);
    let segsHtml = '';
    item.turnos.forEach(t => {
      const segH = item.value > 0 ? (t.value / item.value) * totalH : 0;
      segsHtml += `<div class="bar-seg t${t.n}" style="height:${segH}px" title="${t.turno}: ${fmt(t.value)} un."></div>`;
    });
    html += `<div class="bar-col">
      <div class="bar-val">${fmt(item.value)}</div>
      <div class="bar-stack" style="height:${totalH}px"
           onmouseenter="showBarTip(event, '${containerId}', ${idx})"
           onmousemove="moveTip(event)"
           onmouseleave="hideTip()">${segsHtml}</div>
      <div class="bar-label" title="${item.label}">${item.label}</div>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

// ═══════════════════════ HORIZONTAL BAR CHART ═══════════════════════
function renderHorizontalBars(containerId, data) {
  const container = document.getElementById(containerId);
  if (!data.length) { container.innerHTML = '<div class="no-data">Sem dados com os filtros selecionados</div>'; return; }

  chartDataStore[containerId] = data;
  const maxVal = Math.max(...data.map(d=>d.value), 1);

  let html = '';
  data.forEach((item, idx) => {
    const pct = Math.max((item.value / maxVal) * 100, 1);
    html += `<div class="h-bar-row"
                  onmouseenter="showBarTip(event, '${containerId}', ${idx})"
                  onmousemove="moveTip(event)"
                  onmouseleave="hideTip()">
      <div class="h-bar-name" title="${item.label}">${item.label}</div>
      <div class="h-bar-track">
        <div class="h-bar-fill" style="width:${pct}%">${fmt(item.value)}</div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

// ═══════════════════════ TAB SWITCH ═══════════════════════
function setTab(btn, group) {
  btn.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  tabAtiva[group] = btn.dataset.tab;
  if (group === 'periodo') renderChartPeriodo();
}

// Ordem e rótulos fixos dos turnos para empilhamento (1° embaixo, 3° em cima)
const TURNOS_ORDEM = [{ turno: '1°', n: 1 }, { turno: '2°', n: 2 }, { turno: '3°', n: 3 }];

// ═══════════════════════ RENDER: PERIODO ═══════════════════════
function renderChartPeriodo() {
  const legenda = document.getElementById('legendaPeriodo');
  let keyFn, fmtFn;
  if (tabAtiva.periodo === 'diaria') {
    keyFn = r => r.DATA;
    fmtFn = fmtDiaMesBR;
  } else if (tabAtiva.periodo === 'semanal') {
    keyFn = r => getWeekOfMonthKey(r.DATA);
    fmtFn = fmtSemanaMesBR;
  } else {
    keyFn = r => getMonth(r.DATA);
    fmtFn = fmtMesAnoBR;
  }
  const produtosMap = getProdutosPorGrupo(dadosFiltrados, keyFn);

  if (tabAtiva.periodo === 'diaria') {
    // Empilha os 3 turnos em uma única barra por dia
    const map = groupBy(dadosFiltrados, r => keyFn(r), r => r['QUANTIDADE PRODUZIDA']);
    const turnoMap = {};
    dadosFiltrados.forEach(r => {
      const k = keyFn(r);
      if (!turnoMap[k]) turnoMap[k] = {};
      turnoMap[k][r.TURNO] = (turnoMap[k][r.TURNO] || 0) + r['QUANTIDADE PRODUZIDA'];
    });
    const sorted = Object.entries(map).sort((a,b) => a[0].localeCompare(b[0]));
    // Corta para os últimos 15 dias apenas quando o filtro de data está no período completo (padrão).
    // Se o usuário restringiu manualmente o intervalo De/Até, mostra todos os dias desse intervalo.
    const datasProducao = DADOS_BRUTOS.map(r => r.DATA).filter(Boolean).sort();
    const extremoMin = datasProducao[0];
    const extremoMax = datasProducao[datasProducao.length - 1];
    const filtroIni = document.getElementById('filtroInicio').value;
    const filtroFim = document.getElementById('filtroFim').value;
    const filtroNoPeriodoCompleto = filtroIni === extremoMin && filtroFim === extremoMax;
    const sortedLimitado = filtroNoPeriodoCompleto ? sorted.slice(-15) : sorted;
    const data = sortedLimitado.map(([k,v]) => ({
      label: fmtFn(k),
      fullLabel: 'Data: ' + fmtDataBR(k),
      value: v,
      turnos: TURNOS_ORDEM.map(t => ({ turno: t.turno, n: t.n, value: (turnoMap[k] && turnoMap[k][t.turno]) || 0 })),
      produtos: produtosMap[k] || []
    }));
    legenda.innerHTML = TURNOS_ORDEM.map(t => `
      <span class="turno-legend-item">
        <span class="turno-legend-swatch t${t.n}"></span>${t.turno} Turno
      </span>`).join('');
    renderStackedBars('chartPeriodo', data);
  } else {
    const map = groupBy(dadosFiltrados, r => keyFn(r), r => r['QUANTIDADE PRODUZIDA']);
    const sorted = Object.entries(map).sort((a,b) => a[0].localeCompare(b[0]));
    const data = sorted.map(([k,v]) => ({
      label: fmtFn(k),
      fullLabel: tabAtiva.periodo === 'semanal' ? 'Semana ' + fmtSemanaMesBR(k) : fmtMesAnoBR(k),
      value: v,
      produtos: produtosMap[k] || []
    }));
    legenda.innerHTML = '';
    renderVerticalBars('chartPeriodo', data);
  }
}

// ═══════════════════════ RENDER: INDICADORES DE REFUGO ═══════════════════════
function renderKPIsRefugo() {
  const container = document.getElementById('kpiRefugoGrid');

  // Refugo total por OP (chave normalizada)
  const refugoPorOp = {};
  refugoFiltrado.forEach(r => {
    const key = normalizarOP(r.OP);
    if (key === null) return;
    refugoPorOp[key] = (refugoPorOp[key] || 0) + (Number(r['QUANTIDADE']) || 0);
  });

  // Produção total por OP, somente para as OPs que têm refugo registrado
  const produzidoPorOp = {};
  dadosFiltrados.forEach(r => {
    const key = normalizarOP(r.OP);
    if (key === null || !(key in refugoPorOp)) return;
    produzidoPorOp[key] = (produzidoPorOp[key] || 0) + (Number(r['QUANTIDADE PRODUZIDA']) || 0);
  });

  // Taxa de refugo geral: somente sobre OPs com refugo E produção correspondente
  let totalRefugoRelacionado = 0;
  let totalProduzidoRelacionado = 0;
  let opsRelacionadas = 0;
  Object.keys(refugoPorOp).forEach(key => {
    if (key in produzidoPorOp) {
      totalRefugoRelacionado += refugoPorOp[key];
      totalProduzidoRelacionado += produzidoPorOp[key];
      opsRelacionadas++;
    }
  });
  const totalGeralRelacionado = totalProduzidoRelacionado + totalRefugoRelacionado;
  const taxa = totalGeralRelacionado > 0 ? (totalRefugoRelacionado / totalGeralRelacionado) * 100 : 0;

  // Totais gerais (sem exigir correspondência), para contexto informativo
  const totalRefugoTudo = refugoFiltrado.reduce((s, r) => s + (Number(r['QUANTIDADE']) || 0), 0);

  const causaMap = groupBy(refugoFiltrado, r => r['DESCRIÇÃO REFUGO'], r => r['QUANTIDADE']);
  const causaTop = Object.entries(causaMap).sort((a, b) => b[1] - a[1])[0];

  container.innerHTML = `
    <div class="kpi-card kpi-highlight">
      <div class="kpi-label">Taxa de Refugo Geral</div>
      <div class="kpi-value">${fmtDec(taxa, 2)}%</div>
      <div class="kpi-sub">${fmt(totalRefugoRelacionado)} de ${fmt(totalGeralRelacionado)} un. em ${opsRelacionadas} OP(s) relacionada(s)</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Refugado</div>
      <div class="kpi-value">${fmt(totalRefugoTudo)}</div>
      <div class="kpi-sub">${fmt(refugoFiltrado.length)} registros</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Produção nas OPs com Refugo</div>
      <div class="kpi-value">${fmt(totalProduzidoRelacionado)}</div>
      <div class="kpi-sub">peças boas nas OPs relacionadas</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Principal Causa</div>
      <div class="kpi-value" style="font-size:1.05rem">${causaTop ? causaTop[0] : '-'}</div>
      <div class="kpi-sub">${causaTop ? fmt(causaTop[1]) + ' un.' : '-'}</div>
    </div>
  `;
}

function renderChartCausasRefugo() {
  const map = groupBy(refugoFiltrado, r => r['DESCRIÇÃO REFUGO'], r => r['QUANTIDADE']);
  const breakdown = getBreakdownPorGrupo(
    refugoFiltrado, r => r['DESCRIÇÃO REFUGO'], r => String(r['CODIGO DO PRODUTO']), r => r['QUANTIDADE']
  );
  const sorted = Object.entries(map).sort((a, b) => b[1] - a[1]);
  const data = sorted.map(([k, v]) => ({
    label: k,
    fullLabel: 'Causa: ' + k,
    value: v,
    produtos: breakdown[k] || [],
    subtitulo: 'Itens Afetados',
    prefixo: 'Cód. '
  }));
  renderHorizontalBars('chartCausasRefugo', data);
}

function renderChartItensRefugo() {
  const map = groupBy(refugoFiltrado, r => String(r['CODIGO DO PRODUTO']), r => r['QUANTIDADE']);
  const breakdown = getBreakdownPorGrupo(

  );
  const sorted = Object.entries(map).sort((a, b) => b[1] - a[1]);
  const data = sorted.map(([k, v]) => ({
    label: k,
    fullLabel: 'Código: ' + k,
    value: v,
    produtos: breakdown[k] || [],

    prefixo: ''
  }));
  renderHorizontalBars('chartItensRefugo', data);
}

// ═══════════════════════ RENDER ALL ═══════════════════════
function renderAll() {
  renderKPIs();
  renderChartPeriodo();
  renderChartMaquina();
  renderChartTurno();
  renderChartDiaSemana();
  renderKPIsRefugo();

// Init
